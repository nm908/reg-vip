
name: Build Touch Assist APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Tải mã nguồn từ repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Cài Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 3. Thiết lập Gradle 8.7
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # 4. Kiểm tra cấu trúc dự án
      - name: Check project files
        shell: bash
        run: |
          echo "Checking Android project..."

          if [ ! -f "settings.gradle.kts" ]; then
            echo "::error::Missing settings.gradle.kts at repository root"
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ]; then
            echo "::error::Missing app/build.gradle.kts"
            exit 1
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "::error::Missing app/src/main/AndroidManifest.xml"
            exit 1
          fi

          echo "Project structure looks correct."

      # 5. Build APK
      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      # 6. Kiểm tra APK sau khi build
      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated"
            find app/build/outputs -type f || true
            exit 1
          fi

          ls -lh "$APK"

      # 7. Đổi tên APK cho dễ tải
      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk \
             release/TouchAssist-debug.apk

      # 8. Lưu APK để tải về
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TouchAssist-debug-apk
          path: release/TouchAssist-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 9. Đăng APK công khai khi push tag v1.0.0
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Touch Assist ${{ github.ref_name }}
          generate_release_notes: true
          files: release/TouchAssist-debug.apk
